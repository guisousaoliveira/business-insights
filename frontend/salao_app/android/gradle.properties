org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# O pub cache fica em C: e o projeto em F:. O cache incremental do Kotlin guarda
# caminhos relativos ao projeto para ser relocável, e no Windows não existe
# caminho relativo entre drives diferentes — ele estoura ao gravar
# (IllegalArgumentException: this and base files have different roots) e derruba
# o :shared_preferences_android:compileDebugKotlin. O Kotlin aqui é só a
# MainActivity e os plugins; o incremental não compensa o risco.
kotlin.incremental=false
