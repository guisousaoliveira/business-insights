name: salon_app
description: App de gestão financeira para salão de beleza.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado — usado exclusivamente como Cubit (ver .specs/padrao-de-projeto-flutter/02)
  flutter_bloc: ^8.1.6

  # HTTP — único cliente do app, encapsulado em AppApi
  dio: ^5.7.0

  # Storage de sessão (decisão A4: sem Hive, sem drift)
  shared_preferences: ^2.3.2

  # Formatação de moeda, data e número com o locale ativo
  intl: any

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
